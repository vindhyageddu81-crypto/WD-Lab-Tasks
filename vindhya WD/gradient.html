<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .box{
            display: flex;
        }
        #box1{
            height: 200px;
            width:200px;
            background-image: linear-gradient(rgb(121, 209, 253),pink);
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
         #box2{
            height: 200px;
            width:200px;
            background-image: linear-gradient( to right, rgb(176, 240, 39),rgb(62, 225, 8));
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
         #box3{
            height: 200px;
            width:200px;
            background-image: radial-gradient(circle,rgb(241, 114, 135),rgb(175, 9, 175),rgb(37, 2, 46));
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
         #box4{
            height: 200px;
            width:200px;
            background-image:repeating-radial-gradient(gold,tomato,red,black) ;
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
          #box5{
            height: 200px;
            width:200px;
            background-image:repeating-radial-gradient(gold,tomato,red 10%,rgb(248, 9, 117) 15%) ;
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
        
          #box6{
            height: 200px;
            width:600px;
            background-image:url("https://www.purina.in/sites/default/files/styles/hero_image_regular_large/public/2025-11/Common%20Health%20Problems%20in%20Pomeranians.jpg.webp?itok=mhRPwgFE") ;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0%;
            padding: 50px;
            margin:20px;
            border-radius: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css gradient</title>
</head>
<body>
<div class="box">
    <div id="box1">
      hello
    </div> 
    <div id="box2">
        web Development
    </div>
    <div id="box3">
        web Development
    </div>
    <div id="box4">
        web Development
    </div>
    <div id="box5">
        web Development
    </div>
     
</div>
<div id="box6">
        web Development
    </div>   
</body>
</html>
