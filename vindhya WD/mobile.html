
<!DOCTYPE html>
<html>
<head>
    <title>Mobile First Design</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: tomato;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .profile {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        button {
            background-color: tomato;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

        /* Larger screens */
        @media (min-width: 600px) {
            .container {
                width: 60%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Profile</h1>
    </header>

    <div class="container">
        <div class="profile">

            <img src="https://via.placeholder.com/100"
                 alt="Profile">

            <h2>Vindhya</h2>

            <p>B.Tech Computer Science</p>

            <p>
                Welcome to my student profile.
                I am learning HTML and CSS.
            </p>

            <button>View Profile</button>

        </div>
    </div>

</body>
</html>
